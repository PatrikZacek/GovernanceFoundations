name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CI: true
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet restore GovernanceFoundations.slnx --locked-mode
      - run: dotnet build GovernanceFoundations.slnx -c Release --no-restore
      - run: dotnet test GovernanceFoundations.slnx -c Release --no-build --logger trx --results-directory artifacts/test-results
      - run: dotnet pack GovernanceFoundations.slnx -c Release --no-build -o artifacts/packages
      - run: ./eng/Verify-Packages.ps1 -Version 0.1.0
      - run: ./eng/Smoke-Test.ps1 -Version 0.1.0
      - run: ./eng/Verify-Reproducibility.ps1 -Version 0.1.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            artifacts/packages/*
            artifacts/test-results/*
          if-no-files-found: error
